name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @webdizayn/shared build
      - run: pnpm --filter @webdizayn/check-engine build
      # CHECK engine tests drive a real browser; ubuntu runners ship Google Chrome.
      - run: google-chrome --version
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      # The schema and the committed migrations must not drift apart.
      - name: Migration drift
        run: |
          pnpm --filter @webdizayn/api exec drizzle-kit generate --name ci_drift_probe
          if [ -n "$(git status --porcelain apps/api/drizzle)" ]; then
            git status --porcelain apps/api/drizzle
            echo "Schema changed without a committed migration"; exit 1
          fi
      - name: Dependency audit
        run: pnpm audit --prod
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Production images (deploy/Dockerfile). Not buildable on the development machine
  # (no Docker there), so CI is where they are first verified.
  images:
    runs-on: ubuntu-latest
    needs: check
    strategy:
      matrix:
        target: [api, check-worker, web, sandbox]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.target }}
        run: docker build -f deploy/Dockerfile --target ${{ matrix.target }} -t webdizayn-${{ matrix.target }} .
      - name: Runs as non-root
        run: test "$(docker run --rm --entrypoint id webdizayn-${{ matrix.target }} -u)" != "0"
