# Local infrastructure for when Docker is available. Not required for development:
# the API falls back to embedded PGlite when DATABASE_URL starts with pglite://
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: webdizayn
      POSTGRES_PASSWORD: webdizayn_local_only
      POSTGRES_DB: webdizayn
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
volumes:
  pgdata:
