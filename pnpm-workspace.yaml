packages:
  - apps/*
  - packages/*

allowBuilds:
  '@swc/core': true
  esbuild: true
  unrs-resolver: true
  sharp: true

# Security: Monaco bundles DOMPurify; force a patched copy (GHSA-c6gr-qvv4-5v3f and friends, fixed in 3.4.17).
overrides:
  dompurify: '>=3.4.17'

# Bootstrap 3.4.1 is end-of-life and has no patched release. It is served only to student
# projects inside the RUN/CHECK sandboxes (opaque origin, no network, no platform cookies)
# for the Bootstrap 3 course, never to the platform UI itself.
auditConfig:
  ignoreGhsas:
    - GHSA-vxmc-5x29-h64v
    - GHSA-q58r-hwc8-rm9j
